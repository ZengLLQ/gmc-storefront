openapi: 3.0.3
info:
  title: Global Mandiri Computer (GMC) API
  description: Contract-first API for the GMC Storefront and Back-Office Admin Panel.
  version: 1.0.0
  contact:
    name: Global Mandiri Computer
    email: veneratesman@gmail.com
servers:
  - url: http://localhost:8080
    description: Local API server
  - url: http://localhost:3000/api
    description: Next.js Same-Origin Proxy
tags:
  - name: health
    description: System liveness and readiness
  - name: site
    description: Public site settings, announcements, promo slides, and FAQs
  - name: catalog
    description: Public product catalog, categories, brands, and variants
  - name: cart
    description: Shopping cart validation and synchronization
  - name: checkout
    description: Order creation and lookup
  - name: auth
    description: Customer authentication and session management
  - name: account
    description: Customer profile, addresses, orders, and wishlist
  - name: engagement
    description: Contact messages and newsletter subscriptions
  - name: admin
    description: Back-office administration endpoints

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness probe
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /v1/site:
    get:
      tags: [site]
      operationId: getPublicSite
      summary: Public storefront configuration, announcements, slides, and FAQs
      responses:
        '200':
          description: Public site payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSiteResponse'

  /v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: List active categories ordered by sortOrder
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /v1/brands:
    get:
      tags: [catalog]
      operationId: listBrands
      summary: List active brands with product counts
      responses:
        '200':
          description: Brands list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'

  /v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: Search and filter public products with facets
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: array
            items:
              type: string
        - name: brand
          in: query
          schema:
            type: array
            items:
              type: string
        - name: minPriceIdr
          in: query
          schema:
            type: integer
            format: int64
        - name: maxPriceIdr
          in: query
          schema:
            type: integer
            format: int64
        - name: inStock
          in: query
          schema:
            type: boolean
        - name: featured
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/ProductSort'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Paginated products with facets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'

  /v1/products/{slug}:
    get:
      tags: [catalog]
      operationId: getProductBySlug
      summary: Get full product detail by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/products/{slug}/related:
    get:
      tags: [catalog]
      operationId: getRelatedProducts
      summary: Get up to 8 related products
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Related products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCard'

  /v1/variants/resolve:
    get:
      tags: [catalog]
      operationId: resolveVariant
      summary: Resolve variant by SKU or productSlug and optionValueIds
      parameters:
        - name: sku
          in: query
          schema:
            type: string
        - name: productSlug
          in: query
          schema:
            type: string
        - name: optionValueIds
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Resolved variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedVariantResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/cart/validate:
    post:
      tags: [cart]
      operationId: validateCart
      summary: Validate cart items, recompute server prices, stock, and optional voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartValidateRequest'
      responses:
        '200':
          description: Validated cart state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidationResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/cart:
    get:
      tags: [cart]
      operationId: getMyCart
      summary: Get logged-in user's server cart
      responses:
        '200':
          description: Validated user cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidationResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags: [cart]
      operationId: replaceMyCart
      summary: Replace logged-in user's server cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartValidateRequest'
      responses:
        '200':
          description: Updated user cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidationResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/cart/merge:
    post:
      tags: [cart]
      operationId: mergeMyCart
      summary: Merge guest cart into logged-in user's server cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartValidateRequest'
      responses:
        '200':
          description: Merged user cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartValidationResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/checkout:
    post:
      tags: [checkout]
      operationId: createCheckoutOrder
      summary: Submit order request with stock reservation and idempotency
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'

  /v1/orders/{orderNo}:
    get:
      tags: [checkout]
      operationId: getOrderByOrderNo
      summary: View order by order number (requires guest viewToken or owner session)
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: registerCustomer
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: loginCustomer
      summary: Authenticate customer and issue session cookies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshCustomerSession
      summary: Rotate access and refresh tokens with 10s grace window
      responses:
        '204':
          description: Refreshed cookies set
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logoutCustomer
      summary: Revoke current session and clear cookies
      responses:
        '204':
          description: Logged out

  /v1/auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request password reset instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Accepted without enumeration

  /v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: Get current logged-in customer profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [account]
      operationId: updateMe
      summary: Update current customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/password:
    put:
      tags: [account]
      operationId: changeMyPassword
      summary: Change current password and revoke other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password updated
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/addresses:
    get:
      tags: [account]
      operationId: listMyAddresses
      summary: List saved shipping addresses
      responses:
        '200':
          description: Address list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [account]
      operationId: createMyAddress
      summary: Create a saved shipping address (max 10)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/addresses/{id}:
    patch:
      tags: [account]
      operationId: updateMyAddress
      summary: Update a saved shipping address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [account]
      operationId: deleteMyAddress
      summary: Delete a saved shipping address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/orders:
    get:
      tags: [account]
      operationId: listMyOrders
      summary: List current user's orders
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: q
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Paginated order summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryListResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/orders/{orderNo}:
    get:
      tags: [account]
      operationId: getMyOrderByOrderNo
      summary: Get order detail for current user
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/wishlist:
    get:
      tags: [account]
      operationId: getMyWishlist
      summary: List products in current user's wishlist
      responses:
        '200':
          description: Wishlist items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductCard'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/me/wishlist/{productId}:
    put:
      tags: [account]
      operationId: addWishlistItem
      summary: Add product to wishlist (idempotent)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Added
    delete:
      tags: [account]
      operationId: removeWishlistItem
      summary: Remove product from wishlist (idempotent)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed

  /v1/contact:
    post:
      tags: [engagement]
      operationId: submitContactMessage
      summary: Submit contact form message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
      responses:
        '201':
          description: Contact message saved
          content:
            application/json:
              schema:
                type: object
                required: [whatsappUrl]
                properties:
                  whatsappUrl:
                    type: string
        '422':
          $ref: '#/components/responses/ErrorResponse'

  /v1/newsletter:
    post:
      tags: [engagement]
      operationId: subscribeNewsletter
      summary: Subscribe email to GMC newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterRequest'
      responses:
        '204':
          description: Subscribed
        '422':
          $ref: '#/components/responses/ErrorResponse'

  # ============================================================================
  # ADMIN API (/v1/admin/*)
  # ============================================================================
  /v1/admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Admin/staff login with optional TOTP 2FA code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Authenticated or 2FA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/admin/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      summary: Revoke admin session
      responses:
        '204':
          description: Logged out

  /v1/admin/auth/refresh:
    post:
      tags: [admin]
      operationId: adminRefresh
      summary: Rotate admin session cookies
      responses:
        '204':
          description: Refreshed
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /v1/admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      summary: Get current admin user and permissions
      responses:
        '200':
          description: Admin profile and permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [admin]
      operationId: updateAdminMe
      summary: Update current admin user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated admin profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'

  /v1/admin/me/password:
    put:
      tags: [admin]
      operationId: changeAdminPassword
      summary: Change admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed

  /v1/admin/me/2fa/setup:
    post:
      tags: [admin]
      operationId: setupAdmin2fa
      summary: Generate TOTP secret and otpauth URL
      responses:
        '200':
          description: 2FA setup payload
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl]
                properties:
                  secret:
                    type: string
                  otpauthUrl:
                    type: string

  /v1/admin/me/2fa/confirm:
    post:
      tags: [admin]
      operationId: confirmAdmin2fa
      summary: Confirm TOTP enrollment and issue backup codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Backup codes
          content:
            application/json:
              schema:
                type: object
                required: [backupCodes]
                properties:
                  backupCodes:
                    type: array
                    items:
                      type: string

  /v1/admin/me/2fa/disable:
    post:
      tags: [admin]
      operationId: disableAdmin2fa
      summary: Disable TOTP 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password:
                  type: string
                code:
                  type: string
      responses:
        '204':
          description: Disabled

  /v1/admin/me/sessions:
    get:
      tags: [admin]
      operationId: listAdminSessions
      summary: List active admin sessions for current user
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminSessionInfo'

  /v1/admin/me/sessions/{id}:
    delete:
      tags: [admin]
      operationId: revokeAdminSession
      summary: Revoke a specific admin session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked

  /v1/admin/counters:
    get:
      tags: [admin]
      operationId: getAdminCounters
      summary: Live notification counters for sidebar and top bar
      responses:
        '200':
          description: Admin counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCounters'

  /v1/admin/search:
    get:
      tags: [admin]
      operationId: adminGlobalSearch
      summary: Command palette global search across orders, products, customers
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Global search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSearchResponse'

  /v1/admin/dashboard:
    get:
      tags: [admin]
      operationId: getAdminDashboard
      summary: Dashboard KPIs, charts, and action queues
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [today, 7d, 30d, 90d, custom]
            default: 30d
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'

  /v1/admin/orders:
    get:
      tags: [admin]
      operationId: adminListOrders
      summary: List and filter orders
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
        - name: paymentStatus
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: deliveryMethod
          in: query
          schema:
            $ref: '#/components/schemas/DeliveryMethod'
        - name: paymentMethod
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: source
          in: query
          schema:
            type: string
            enum: [web, manual]
        - name: hasVoucher
          in: query
          schema:
            type: boolean
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Paginated admin orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderListResponse'
    post:
      tags: [admin]
      operationId: adminCreateManualOrder
      summary: Create manual walk-in or WhatsApp order
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
