components:
  responses:
    ErrorResponse:
      description: Standard GMC error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorCode:
      type: string
      enum:
        - bad_request
        - validation_failed
        - unauthorized
        - token_expired
        - invalid_credentials
        - forbidden
        - not_found
        - conflict
        - email_taken
        - out_of_stock
        - price_changed
        - idempotency_conflict
        - rate_limited
        - store_closed
        - internal

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            requestId:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string

    UserRole:
      type: string
      enum: [customer, staff, admin]

    StockStatus:
      type: string
      enum: [in_stock, low_stock, preorder, out_of_stock]

    ProductSort:
      type: string
      enum: [newest, price_asc, price_desc, name_asc]

    ImageKind:
      type: string
      enum: [product, lifestyle, detail]

    OptionDisplay:
      type: string
      enum: [pill, swatch]

    DeliveryMethod:
      type: string
      enum: [pickup, delivery]

    PaymentMethod:
      type: string
      enum: [bank_transfer, cod, pay_at_store]

    PaymentStatus:
      type: string
      enum: [unpaid, paid, refunded]

    OrderStatus:
      type: string
      enum:
        - menunggu_konfirmasi
        - menunggu_pembayaran
        - diproses
        - dikirim
        - siap_diambil
        - selesai
        - dibatalkan

    CartLineIssue:
      type: string
      nullable: true
      enum: [out_of_stock, insufficient_stock, unavailable, null]

    ContactSubject:
      type: string
      enum: [tanya_produk, order, garansi_retur, lainnya]

    Brand:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        productCount:
          type: integer

    Category:
      type: object
      required: [id, slug, name, parentSlug]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        parentSlug:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        sortOrder:
          type: integer
        productCount:
          type: integer

    Image:
      type: object
      required: [url, alt, width, height, kind]
      properties:
        url:
          type: string
        alt:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        kind:
          $ref: '#/components/schemas/ImageKind'

    ProductCard:
      type: object
      required:
        - id
        - slug
        - name
        - summary
        - brand
        - category
        - priceFromIdr
        - priceToIdr
        - compareAtPriceFromIdr
        - images
        - stockStatus
        - isFeatured
        - hasVariants
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        summary:
          type: string
        brand:
          $ref: '#/components/schemas/Brand'
        category:
          $ref: '#/components/schemas/Category'
        priceFromIdr:
          type: integer
          format: int64
        priceToIdr:
          type: integer
          format: int64
        compareAtPriceFromIdr:
          type: integer
          format: int64
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        isFeatured:
          type: boolean
        hasVariants:
          type: boolean
        defaultVariantId:
          type: string
          format: uuid

    ProductOptionValue:
      type: object
      required: [id, label, swatchHex]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        swatchHex:
          type: string
          nullable: true

    ProductOption:
      type: object
      required: [id, name, display, values]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display:
          $ref: '#/components/schemas/OptionDisplay'
        values:
          type: array
          items:
            $ref: '#/components/schemas/ProductOptionValue'

    ProductVariant:
      type: object
      required:
        - id
        - sku
        - optionValueIds
        - priceIdr
        - compareAtPriceIdr
        - stock
        - stockStatus
        - imageUrl
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        optionValueIds:
          type: array
          items:
            type: string
            format: uuid
        priceIdr:
          type: integer
          format: int64
        compareAtPriceIdr:
          type: integer
          format: int64
          nullable: true
        stock:
          type: integer
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        imageUrl:
          type: string
          nullable: true

    ProductDetail:
      type: object
      required:
        - id
        - slug
        - name
        - summary
        - description
        - highlights
        - specs
        - brand
        - category
        - priceFromIdr
        - priceToIdr
        - compareAtPriceFromIdr
        - images
        - stockStatus
        - isFeatured
        - hasVariants
        - options
        - variants
        - whatsappUrl
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        summary:
          type: string
        description:
          type: string
        highlights:
          type: array
          items:
            type: string
        specs:
          type: object
          additionalProperties:
            type: string
        brand:
          $ref: '#/components/schemas/Brand'
        category:
          $ref: '#/components/schemas/Category'
        priceFromIdr:
          type: integer
          format: int64
        priceToIdr:
          type: integer
          format: int64
        compareAtPriceFromIdr:
          type: integer
          format: int64
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        isFeatured:
          type: boolean
        hasVariants:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
        whatsappUrl:
          type: string
        seoTitle:
          type: string
          nullable: true
        seoDescription:
          type: string
          nullable: true

    FacetBucket:
      type: object
      required: [slug, count]
      properties:
        slug:
          type: string
        count:
          type: integer

    ProductFacets:
      type: object
      required: [categories, brands, priceRange]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        brands:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucket'
        priceRange:
          type: object
          required: [minIdr, maxIdr]
          properties:
            minIdr:
              type: integer
              format: int64
            maxIdr:
              type: integer
              format: int64

    ProductListResponse:
      type: object
      required: [items, page, pageSize, total, totalPages, facets]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        facets:
          $ref: '#/components/schemas/ProductFacets'

    ResolvedVariantResponse:
      type: object
      required: [productSlug, variant]
      properties:
        productSlug:
          type: string
        variant:
          $ref: '#/components/schemas/ProductVariant'

    CartItemInput:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    CartValidateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemInput'
        voucherCode:
          type: string
          nullable: true

    CartLine:
      type: object
      required:
        - variantId
        - sku
        - productSlug
        - name
        - brand
        - variantLabel
        - imageUrl
        - unitPriceIdr
        - quantity
        - lineTotalIdr
        - stock
        - stockStatus
        - issue
      properties:
        variantId:
          type: string
          format: uuid
        sku:
          type: string
        productSlug:
          type: string
        name:
          type: string
        brand:
          type: string
        variantLabel:
          type: string
        imageUrl:
          type: string
          nullable: true
        unitPriceIdr:
          type: integer
          format: int64
        quantity:
          type: integer
        lineTotalIdr:
          type: integer
          format: int64
        stock:
          type: integer
        stockStatus:
          $ref: '#/components/schemas/StockStatus'
        issue:
          $ref: '#/components/schemas/CartLineIssue'

    AppliedVoucherInfo:
      type: object
      nullable: true
      required: [code, description]
      properties:
        code:
          type: string
        description:
          type: string

    CartValidationResponse:
      type: object
      required: [lines, subtotalIdr, discountIdr, totalIdr, hasIssues]
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        subtotalIdr:
          type: integer
          format: int64
        discountIdr:
          type: integer
          format: int64
        totalIdr:
          type: integer
          format: int64
        voucher:
          $ref: '#/components/schemas/AppliedVoucherInfo'
        voucherIssue:
          type: string
          nullable: true
        hasIssues:
          type: boolean

    ShippingAddress:
      type: object
      required: [recipientName, phone, street, city, province, postalCode]
      properties:
        recipientName:
          type: string
        phone:
          type: string
        street:
          type: string
        city:
          type: string
        province:
          type: string
